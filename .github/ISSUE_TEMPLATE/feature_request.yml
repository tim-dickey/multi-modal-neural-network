name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please provide enough context for maintainers and contributors to understand and evaluate the request.

  - type: checkboxes
    id: existing_issues
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and discussions — this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation does this feature address?
      placeholder: "I'm trying to do X but currently I have to work around it by…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative approaches or workarounds?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, references, or screenshots that would help clarify the request.
